[build]
  publish = "."

# Redirect /fr and /pt without trailing slash
[[redirects]]
  from = "/fr"
  to = "/fr/"
  status = 301

[[redirects]]
  from = "/pt"
  to = "/pt/"
  status = 301

# Browser language auto-redirect from homepage
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  conditions = {Language = ["fr", "fr-FR", "fr-BE", "fr-CH", "fr-CA"]}

[[redirects]]
  from = "/"
  to = "/pt/"
  status = 302
  conditions = {Language = ["pt", "pt-PT", "pt-BR"]}
